name: Isolation (container lockdown probe)

# P6.3: exercise the end-to-end container lockdown probe
# (tools/verify_container_sandbox.py) in CI, on a matrix of Ubuntu runner images,
# recording the actual cgroup version, kernel, and Docker version each runner
# reports. The probe is a standalone exit-0-or-1 script (NOT collected by the
# pytest suite that ci.yml runs), so without this workflow the network/OOM/PID/
# read-only/timeout/teardown lockdown checks are never exercised in CI. The
# probe's exit code gates each leg: a lockdown breach (network reachable, the
# memory cap not firing, the fork bomb not contained, ...) fails CI. See
# decision 0030 and the native-Linux verification section of SECURITY.md.
#
# COVERAGE SCOPE (stated plainly, do not overclaim): hosted GitHub runners are
# Ubuntu on cgroup v2, so this matrix exercises the lockdown on cgroup v2 across
# two Ubuntu versions (two kernels, one Docker version) only. cgroup v1 and
# non-Ubuntu distributions are NOT exercised here; a real v1 or alternate-distro
# run is a documented self-hosted / VM follow-up (decision 0030, SECURITY.md).
#
# Runs on push to any branch (so a phase branch can be seen green before merge)
# and on pull requests to main (so main is gated). No secrets: the probe uses the
# container and fake candidates, never a live ANTHROPIC_API_KEY.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  lockdown-probe:
    # fail-fast: false so a failure on one runner image still lets the other leg
    # run and report its own cgroup/kernel/Docker version and probe result --
    # per-leg evidence is the point of the matrix.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Hashed install path from P6.2.1 (decision 0028): the same hashed dev lock
      # ci.yml installs, enforced with --require-hashes. The probe only imports
      # sandbox_container (stdlib only), but installing the dev lock keeps this
      # workflow's environment identical to the test job's.
      - name: Install host dependencies (hashed lock)
        run: pip install --require-hashes -r requirements-dev.txt

      # The probe runs candidates via docker run, so the image must exist first.
      # Exact command from the README and ci.yml, built from the pinned Dockerfile.
      - name: Build the sandbox image
        run: docker build -f tools/Dockerfile.sandbox -t darwin-sandbox:py313 tools/

      # Record the runner's real isolation environment so the SECURITY.md scope is
      # backed by the matrix output, not an assumption. cgroup version is the
      # version-dependent piece (it drives the .State.OOMKilled flag the probe
      # asserts); kernel and Docker version document the variety the matrix covers.
      - name: Record runner isolation environment
        run: |
          echo "runner image:   ${{ matrix.runner }}"
          echo "cgroup version: $(docker info --format '{{.CgroupVersion}}')"
          echo "kernel:         $(uname -r)"
          echo "docker version: $(docker --version)"

      # The probe's exit code gates this leg. Exit 0 = every lockdown guarantee
      # held (clean pass, failing candidate, crash, network blocked, host FS
      # blocked, hard timeout with clean teardown, memory flood OOM-killed by the
      # cap, fork bomb contained by the PID cap, zero leaks). Exit 1 = a guarantee
      # broke, which fails CI. Run from tools/ so imports resolve as every other
      # invocation does.
      - name: Run the container lockdown probe (exit code gates this leg)
        working-directory: tools
        run: python verify_container_sandbox.py
