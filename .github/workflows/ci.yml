name: CI

# Build the sandbox image and run the full suite across a host-Python matrix
# (3.12, 3.13, 3.14; P7.5), and (in a separate job) generate a CycloneDX SBOM of
# the deployable runtime surface as a build artifact (P6.2.2). The test job runs on
# all three host interpreters to back the README's verified 3.12-to-3.14 host range;
# the sandbox container stays pinned to 3.13 on every leg, so the matrix exercises
# the host orchestration code, not the in-container runner. The single hashed dev
# lock installs under --require-hashes on all three host versions from one
# 3.13-compiled file (decision 0028), so no per-version locks are needed. Runs on
# push to any branch (so a phase branch can be seen green before merge) and on pull
# requests to main (so main is gated). No secrets: the suite uses fakes and the
# container, never a live ANTHROPIC_API_KEY.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Run the full suite once per supported host Python (P7.5). fail-fast: false so
    # a failure on one interpreter does not cancel the others; every leg reports its
    # own result. Versions are quoted strings so YAML does not read 3.x as a float.
    # The sandbox image below is fixed at 3.13 on every leg, so the matrix varies
    # only the host orchestration interpreter, not the in-container runner.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Host deps via requirements-dev.txt: the runtime deps (radon, vulture,
      # pytest, anthropic; httpx arrives transitively via anthropic) plus
      # pytest-cov for the coverage report below. anthropic is required even
      # with no API call, because tests/test_mloop.py imports darwin.generator,
      # which imports anthropic at collection time.
      - name: Install host dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      # The suite runs candidates via docker run, so the image must exist first.
      # Exact command from the README. The image is pinned to Python 3.13 on every
      # matrix leg: the tag darwin-sandbox:py313 and docker/Dockerfile.sandbox do not
      # vary with the host leg, because the matrix exercises the host orchestration,
      # not the in-container runner.
      - name: Build the sandbox image
        run: docker build -f docker/Dockerfile.sandbox -t darwin-sandbox:py313 docker/

      # Run from the repo root: the package is imported via the pyproject
      # [tool.pytest.ini_options] pythonpath = ["src"], and testpaths = ["tests"]
      # pins collection to tests/. Expected (indicative; the count grows as tests are
      # added): 263 passed, 2 xfailed (the decision-0008 in-process forgery vectors),
      # plus one Docker-gated skip when the daemon is absent. pytest's default exit
      # codes fail CI on any failure or XPASS. Coverage is GATED (P7.4) and package-scoped
      # (--cov=darwin): coverage is measured over src/darwin only, and the tests live
      # outside the package so they fall out naturally (the test_*.py omit is no longer
      # load-bearing). P8.4 re-based the floor to --cov-fail-under=62 against the
      # package-scoped number: production coverage measured about 64.6 percent under
      # --cov=darwin (64.56 on host 3.14, 65.08 on 3.13), floored to 64 less a 2-point
      # cross-version margin. See docs/quality-baseline.md and decision 0037.
      - name: Run the suite (coverage gated at 62 percent)
        run: python -m pytest -q -p no:cacheprovider --cov=darwin --cov-report=term-missing --cov-config=pyproject.toml --cov-fail-under=62

  # Generate a CycloneDX SBOM of the deployable runtime surface and upload it as a
  # build artifact. The SBOM is generated from requirements.txt (the runtime lock),
  # NOT requirements-dev.txt, so it describes what ships, not the dev/CI tooling.
  # cyclonedx-py is the generator from cyclonedx-bom (pip-ecosystem, matching
  # pip-tools), pinned in the hashed dev lock; the SBOM is a build artifact, not a
  # committed file. See decision 0029.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install host dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      # Confirmed from `cyclonedx-py requirements --help`: positional requirements
      # file, --output-format JSON, --output-file. Validates the BOM before output
      # (default --validate). Emits CycloneDX 1.6.
      - name: Generate CycloneDX SBOM from the runtime lock
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
