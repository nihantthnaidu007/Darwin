name: CI

# Build the sandbox image and run the full suite. Runs on push to any branch
# (so a phase branch can be seen green before merge) and on pull requests to
# main (so main is gated). No secrets: the suite uses fakes and the container,
# never a live ANTHROPIC_API_KEY.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Host deps via requirements-dev.txt: the runtime deps (radon, vulture,
      # pytest, anthropic; httpx arrives transitively via anthropic) plus
      # pytest-cov for the coverage report below. anthropic is required even
      # with no API call, because tools/test_mloop.py imports generator, which
      # imports anthropic at collection time.
      - name: Install host dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      # The suite runs candidates via docker run, so the image must exist first.
      # Exact command from the README.
      - name: Build the sandbox image
        run: docker build -f tools/Dockerfile.sandbox -t darwin-sandbox:py313 tools/

      # Run from tools/ so imports resolve as every other invocation does.
      # Expected: 75 passed, 2 xfailed (the decision-0008 in-process forgery
      # vectors). pytest's default exit codes fail CI on any failure or XPASS.
      # Coverage is reported (term-missing) but NOT gated: there is no
      # --cov-fail-under, so the gate still fails only on a test failure or an
      # unexpected pass. The exit behavior is unchanged by the coverage addition.
      - name: Run the suite (with coverage, reported not gated)
        working-directory: tools
        run: python -m pytest -q -p no:cacheprovider --cov=. --cov-report=term-missing --cov-config=../pyproject.toml
