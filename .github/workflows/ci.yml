name: CI

# Build the sandbox image and run the full suite, and (in a separate job)
# generate a CycloneDX SBOM of the deployable runtime surface as a build artifact
# (P6.2.2). Runs on push to any branch (so a phase branch can be seen green before
# merge) and on pull requests to main (so main is gated). No secrets: the suite
# uses fakes and the container, never a live ANTHROPIC_API_KEY.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Host deps via requirements-dev.txt: the runtime deps (radon, vulture,
      # pytest, anthropic; httpx arrives transitively via anthropic) plus
      # pytest-cov for the coverage report below. anthropic is required even
      # with no API call, because tools/test_mloop.py imports generator, which
      # imports anthropic at collection time.
      - name: Install host dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      # The suite runs candidates via docker run, so the image must exist first.
      # Exact command from the README.
      - name: Build the sandbox image
        run: docker build -f tools/Dockerfile.sandbox -t darwin-sandbox:py313 tools/

      # Run from tools/ so imports resolve as every other invocation does.
      # Expected (indicative; the count grows as tests are added): 257 passed,
      # 2 xfailed (the decision-0008 in-process forgery vectors), plus one
      # Docker-gated skip when the daemon is absent. pytest's default exit codes
      # fail CI on any failure or XPASS. Coverage is GATED as of P7.4 at
      # --cov-fail-under=56: production coverage measured 58 percent via this exact
      # invocation (the --cov-config omit excludes test files), floored to 58 and
      # cut by a 2-point cross-version/CI margin. The omit lives in pyproject.toml;
      # see docs/quality-baseline.md.
      - name: Run the suite (coverage gated at 56 percent)
        working-directory: tools
        run: python -m pytest -q -p no:cacheprovider --cov=. --cov-report=term-missing --cov-config=../pyproject.toml --cov-fail-under=56

  # Generate a CycloneDX SBOM of the deployable runtime surface and upload it as a
  # build artifact. The SBOM is generated from requirements.txt (the runtime lock),
  # NOT requirements-dev.txt, so it describes what ships, not the dev/CI tooling.
  # cyclonedx-py is the generator from cyclonedx-bom (pip-ecosystem, matching
  # pip-tools), pinned in the hashed dev lock; the SBOM is a build artifact, not a
  # committed file. See decision 0029.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install host dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      # Confirmed from `cyclonedx-py requirements --help`: positional requirements
      # file, --output-format JSON, --output-file. Validates the BOM before output
      # (default --validate). Emits CycloneDX 1.6.
      - name: Generate CycloneDX SBOM from the runtime lock
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
