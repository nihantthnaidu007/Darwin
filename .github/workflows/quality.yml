name: Quality (blocking)

# Quality gates, BLOCKING as of P7.4. Four jobs -- ruff (lint + format check),
# mypy (lenient baseline), a gitleaks secret scan, and a pip-audit dependency
# vulnerability scan (P6.2.2) -- run on push to any branch and on pull requests
# to main. Every tool gate blocks: a finding fails its job and blocks the merge.
# These ran non-blocking from P0.2 (decision 0016) while the baseline findings
# were driven to zero; P7.3 reached 0/0/0 (docs/quality-baseline.md) and P7.1
# cleared the pip-audit finding, so P7.4 makes every tool step blocking. The
# infrastructure steps (checkout, setup-python, install) carry no tolerance
# either, so a real break still fails the job.
#
# ruff and mypy target the package source in src/darwin and the tests/ suite;
# cases/ and spikes/ are excluded in pyproject.toml. The tool pins live in
# requirements-dev.txt and the baseline finding counts are in docs/quality-baseline.md.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff lint (blocking)
        run: ruff check src tests
      - name: Ruff format check (blocking)
        run: ruff format --check src tests

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Mypy (lenient, blocking)
        run: mypy src tests

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0             # gitleaks scans the full commit history
      - name: Gitleaks secret scan (blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency vulnerability scan (P6.2.2), BLOCKING as of P7.4. pip-audit
  # (pip-ecosystem, matching pip-tools; pinned in the hashed dev lock) checks the
  # runtime closure (requirements.txt) and the sandbox closure
  # (docker/requirements-sandbox.txt) against the PyPI advisory database. pip-audit
  # exits non-zero on a finding, which now fails the job: the P7.1 pytest bump
  # cleared the one finding (CVE-2025-71176), so the scan flips to blocking with
  # the other gates. See decision 0029.
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      # Confirmed from `pip-audit --help`: -r is repeatable and reads the hashed
      # lock files directly (no extra flag needed).
      - name: pip-audit dependency vulnerability scan (blocking)
        run: pip-audit -r requirements.txt -r docker/requirements-sandbox.txt
