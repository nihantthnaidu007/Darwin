name: Quality (advisory)

# P0.2 advisory quality gates. Three jobs -- ruff (lint + format check), mypy
# (lenient baseline), and a gitleaks secret scan -- run on push to any branch
# and on pull requests to main. Every job is advisory: continue-on-error keeps
# the workflow run green so a finding surfaces in the Actions UI without
# blocking a merge. Flipping these to blocking is deferred to P7.2.
#
# ruff and mypy target the production code in tools/ only; cases/ and spikes/
# are excluded in pyproject.toml. The tool pins live in requirements-dev.txt and
# the current baseline finding counts are recorded in docs/quality-baseline.md.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    continue-on-error: true          # advisory: a lint or format finding never blocks a merge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint (advisory)
        continue-on-error: true      # do not abort the job, so the format check below still reports
        run: ruff check tools/
      - name: Ruff format check (advisory)
        run: ruff format --check tools/

  mypy:
    runs-on: ubuntu-latest
    continue-on-error: true          # advisory: a type error never blocks a merge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Mypy (lenient, advisory)
        run: mypy tools/

  secret-scan:
    runs-on: ubuntu-latest
    continue-on-error: true          # advisory: a secret-scan hit never blocks a merge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0             # gitleaks scans the full commit history
      - name: Gitleaks secret scan (advisory)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
