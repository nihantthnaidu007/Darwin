# Darwin: release metadata for the 0.6.0 GitHub-tagged release.
#
# Version is 0.6.0, staying in the 0.x line on purpose: a 1.0 would signal a
# stable, production-grade release. Over 0.2.0, the release line adds multi-file
# simplification (the multi-file generator, the directed multi-file loop, and the
# multi-file evaluator plus benchmark harness) on top of the single-function
# engine and the v2.0 OS-level isolation boundary; it adds the project's first
# test-running CI (build the sandbox image, run the full suite, gate pushes and
# PRs on ubuntu-latest); and it adds a Linux bind-mount staging fix so the
# container runs on native Linux Docker hosts, not only macOS Docker Desktop.
# Over 0.3.0, it adds resilience and operability: hardened LLM calls and resumable
# checkpointed runs, an image preflight that tolerates an inspect-by-tag false
# negative, structured logging across the core path, and guarded JSON input
# validation, with no change to the optimization, scoring, or equivalence behavior.
# Over 0.4.1, it adds correctness, determinism, and reproducibility (v0.5): a
# documented feedback-materiality threshold with reports/aggregate.json regenerated
# to match the prose, an explicit pinned temperature with full run provenance
# (temperature, model, SDK version, request params) recorded in run.json, a variance
# harness with committed-snapshot persistence (the artifact-backed multi-file
# variance regeneration is deferred to an authorized run), uuid-minted dynamic-import
# names across the eval-path loaders, and the oracle witness prefixes bound to a
# shared marker guarded by a real-producer leak test, again with no change to the
# optimization, scoring, or equivalence behavior.
# Over 0.5.0, it adds supply-chain and isolation hardening (v0.6): the sandbox base
# image pinned by manifest-list digest with a documented rotation procedure;
# hash-locked lockfiles (pip-tools, --generate-hashes) for the host, CI, and the
# sandbox image, installed with --require-hashes, plus a CycloneDX SBOM build
# artifact and an advisory pip-audit vulnerability scan in CI; a CI matrix exercising
# the container lockdown probe across two Ubuntu runners on cgroup v2, recording the
# actual cgroup version, with a native-Linux SECURITY.md section scoped to that
# evidence; and defense-in-depth -- opt-in, off-by-default seccomp plumbing with a
# byte-identical default argv and an example starting-point profile, plus the typed
# VerdictEmitter seam (in-process default, serializable verdict) prepared for the 2.0
# out-of-process emitter -- again with no change to the optimization, scoring, or
# equivalence behavior.
# It still carries the in-process verdict-forgery residual (SECURITY.md, decision
# 0008): the candidate and the trusted result-emitter share one process, so no
# part of Darwin is forgery-proof, now with the VerdictEmitter seam prepared to
# receive its 2.0 out-of-process fix. The multi-file references are soft and the
# corpus is small (3 multi-file plus 5 single-function validation cases, not a
# benchmark), so 0.6.0 makes no benchmark-grade claim. 0.6.0 honestly signals
# "supply-chain and isolation hardening added on top of correctness, determinism,
# and reproducibility, still early."
#
# Multi-file finding, carried forward plainly (decision 0014): generation 1 does
# most of the work, and the directed feedback loop is opportunistic and
# high-variance at this scope, not a dependable multi-generation improvement.
#
# Darwin is run FROM SOURCE: create a virtualenv and `pip install -r requirements.txt`,
# then build the sandbox image once (see README "Install"; Docker is a
# prerequisite). This file declares coherent, honest release metadata: name,
# version, description, pinned runtime dependencies. It is a GitHub-tagged release;
# it is NOT published to PyPI.
#
# It intentionally omits a [build-system] table: Darwin is a set of flat scripts
# under tools/ that are run with `cwd = tools/`, NOT yet structured as an importable
# / pip-installable package. Adding a build backend now would advertise a
# `pip install .` path that does not actually work. A pip-installable distribution
# is deferred to a later release.

[project]
name = "darwin"
version = "0.6.0"
description = "A verified Python code simplifier for single-function and multi-file units with a never-worse-than-baseline guarantee; each candidate runs in a locked-down container that runs on Linux Docker hosts (CI-verified on ubuntu-latest), access-isolated but not a forgery-proof gate (in-process forgery residual open); still early (0.x)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nihanth" }]
keywords = [
    "code-optimization",
    "code-simplification",
    "static-analysis",
    "cyclomatic-complexity",
    "llm",
    "radon",
    "vulture",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]

# Runtime dependencies, version-pinned. Kept in sync with the direct list in
# requirements.in (the source you edit for the direct runtime deps). The full
# closure lives in the generated, hash-locked requirements.txt (direct plus
# transitive, compiled with pip-compile --generate-hashes and installed with
# pip --require-hashes); requirements.txt is generated, never hand-edited. See
# decision 0028. This list mirrors requirements.in's pins, name-for-name.
dependencies = [
    "radon==6.0.1",
    "vulture==2.16",
    "pytest==8.3.5",
    "anthropic==0.107.1",
    "httpx==0.28.1",
]

[project.urls]
Repository = "https://github.com/nihanthnaidu007/Darwin"

# Quality tooling config (P0.2). Advisory only: CI surfaces findings without
# blocking (.github/workflows/quality.yml); the blocking flip is P7.2. ruff and
# mypy target the production code in tools/; cases/ (bloated benchmark fixtures)
# and spikes/ (experiments) are excluded so they generate no meaningless findings.

[tool.ruff]
# Default rule selection (E/F), no custom select. target-version matches
# requires-python (>=3.12).
target-version = "py312"
extend-exclude = ["cases", "spikes"]

[tool.mypy]
# Lenient baseline: tolerate unresolved third-party imports, no strict mode.
# The tools/ scripts are untyped; this records a baseline, it does not enforce.
ignore_missing_imports = true
exclude = ['^cases/', '^spikes/']

[tool.coverage.run]
# Coverage is reported, not gated. Omit the test files themselves (the suite
# runs from tools/, so paths are relative to that directory).
omit = [
    "test_*.py",
    "*/test_*.py",
]
