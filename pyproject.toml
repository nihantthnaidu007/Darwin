# Darwin: release metadata for the 1.0.0 GitHub-tagged release.
#
# Version is 1.0.0, the single-user-trusted reproducible-benchmark freeze (framing
# (b); decisions 0046, 0008). 1.0.0 marks a stable, reproducible surface, NOT a
# production-grade release for any user. It deliberately does NOT adopt decision
# 0005's retired framing that reserved 1.0 to signal production-grade stability; the
# in-process verdict-forgery boundary stays open by design and is deferred to 2.0.
# Over 0.2.0, the release line adds multi-file
# simplification (the multi-file generator, the directed multi-file loop, and the
# multi-file evaluator plus benchmark harness) on top of the single-function
# engine and the v2.0 OS-level isolation boundary; it adds the project's first
# test-running CI (build the sandbox image, run the full suite, gate pushes and
# PRs on ubuntu-latest); and it adds a Linux bind-mount staging fix so the
# container runs on native Linux Docker hosts, not only macOS Docker Desktop.
# Over 0.3.0, it adds resilience and operability: hardened LLM calls and resumable
# checkpointed runs, an image preflight that tolerates an inspect-by-tag false
# negative, structured logging across the core path, and guarded JSON input
# validation, with no change to the optimization, scoring, or equivalence behavior.
# Over 0.4.1, it adds correctness, determinism, and reproducibility (v0.5): a
# documented feedback-materiality threshold with reports/aggregate.json regenerated
# to match the prose, an explicit pinned temperature with full run provenance
# (temperature, model, SDK version, request params) recorded in run.json, a variance
# harness with committed-snapshot persistence (the artifact-backed multi-file
# variance regeneration is deferred to an authorized run), uuid-minted dynamic-import
# names across the eval-path loaders, and the oracle witness prefixes bound to a
# shared marker guarded by a real-producer leak test, again with no change to the
# optimization, scoring, or equivalence behavior.
# Over 0.5.0, it adds supply-chain and isolation hardening (v0.6): the sandbox base
# image pinned by manifest-list digest with a documented rotation procedure;
# hash-locked lockfiles (pip-tools, --generate-hashes) for the host, CI, and the
# sandbox image, installed with --require-hashes, plus a CycloneDX SBOM build
# artifact and an advisory pip-audit vulnerability scan in CI; a CI matrix exercising
# the container lockdown probe across two Ubuntu runners on cgroup v2, recording the
# actual cgroup version, with a native-Linux SECURITY.md section scoped to that
# evidence; and defense-in-depth -- opt-in, off-by-default seccomp plumbing with a
# byte-identical default argv and an example starting-point profile, plus the typed
# VerdictEmitter seam (in-process default, serializable verdict) prepared for the 2.0
# out-of-process emitter -- again with no change to the optimization, scoring, or
# equivalence behavior.
# Over 0.6.0, it adds test and CI maturity (v0.7): the pytest 8.3.5 to 9.0.3 bump
# that clears CVE-2025-71176 (re-locked on Python 3.13, pulling pygments in as a new
# transitive of the runtime and sandbox closures); direct unit tests for the loop
# orchestrator and the single-function verifier (loop.py and verify_case.py both at
# 99 percent line coverage); the four quality gates (ruff lint and format, mypy,
# gitleaks, pip-audit) driven to zero findings and flipped from advisory to blocking,
# with the coverage gate set at --cov-fail-under=56 (production coverage measured 58
# percent, less a 2-point margin); and a Python 3.12/3.13/3.14 host CI matrix
# validated against the single hashed dev lock -- again with no change to the
# optimization, scoring, or equivalence behavior.
# Over 0.7.0, it adds packaging (v0.8): the flat tools/ scripts became an importable
# darwin package under src/ (absolute imports, a paths.py walk-up data-root resolver),
# this [build-system] table and the six darwin-* console scripts below were added so a
# pip install . path works, all data-root resolution was deferred out of import time
# (a PEP 562 lazy module-attribute pattern) so the installed CLIs run without a checkout
# on disk, and the coverage gate was re-based to the package-scoped number
# (--cov-fail-under=62, from production coverage measured at about 64.6 percent under
# --cov=darwin, floored to 64 less a 2-point margin) -- again with no change to the
# optimization, scoring, or equivalence behavior.
# Over 0.8.0, it adds corpus expansion (v0.9): the single-function validation set is
# expanded from 5 to 30 controlled cases, each a hand-authored clean reference degraded
# by the bloat tool, run 5 times under one fixed config (150 runs); the authoritative
# dataset (reports/v0.9-dataset.json) and reports/RESULTS.md establish the one-shot
# finding on 30 cases rather than 5 (95.3 percent of runs reach their returned-best
# candidate in generation 1). The corpus is synthetic by construction and that is the
# headline limitation; the real-world claim is explicitly out of scope. The milestone is
# documentation and corpus only -- no change to the optimization, scoring, equivalence,
# or default-lockdown behavior (decisions 0043 through 0045).
# It still carries the in-process verdict-forgery residual (SECURITY.md, decision
# 0008): the candidate and the trusted result-emitter share one process, so no
# part of Darwin is forgery-proof, now with the VerdictEmitter seam prepared to
# receive its 2.0 out-of-process fix. The multi-file references are soft, and the
# single-function corpus, though expanded to 30 cases in v0.9, is synthetic by
# construction (authored references degraded by a tool, not real-world code), with the
# 3 multi-file cases still a small set, so 0.9.0 makes no benchmark-grade or real-world
# claim. 0.9.0 honestly signals "the one-shot finding grounded on a 30-case synthetic
# single-function corpus, on top of packaging, test and CI maturity, supply-chain and
# isolation hardening, correctness, determinism, and reproducibility, still early."
#
# Multi-file finding, carried forward plainly (decision 0014): generation 1 does
# most of the work, and the directed feedback loop is opportunistic and
# high-variance at this scope, not a dependable multi-generation improvement.
#
# Darwin installs two ways (see README "Install"): the supported, reproducible path is
# the hash-locked requirements.txt installed with --require-hashes (pip-tools
# --generate-hashes, decision 0028); the convenience path is `pip install .`, which
# resolves [project].dependencies below as version ranges and is NOT hash-locked. Either
# way Docker is a prerequisite and the sandbox image is built once. This file declares
# coherent, honest release metadata: name, version, description, runtime dependencies.
# It is a GitHub-tagged release; it is NOT published to PyPI.
#
# It declares a [build-system] table (added P8.3): the package was converted from the
# flat tools/ scripts to an importable darwin package under src/ in P8.2, so a build
# backend can advertise a `pip install .` path that actually works. The backend is
# hatchling, configured for the src layout (it discovers the darwin package under src/).
# [project].version is 1.0.0 as of the P10.2 freeze, the single-user-trusted reproducible
# benchmark release (decision 0046; the corpus-expansion finding that grounds it is
# decisions 0043-0045); the wheel `pip install .` builds is the convenience artifact,
# still NOT published to PyPI.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darwin"
version = "1.0.0"
description = "A verified Python code simplifier for single-function and multi-file units with a never-worse-than-baseline guarantee; each candidate runs in a locked-down container that runs on Linux Docker hosts (CI-verified on ubuntu-latest), access-isolated but not a forgery-proof gate (in-process forgery residual open by design, deferred to 2.0); a single-user-trusted research benchmark and engine at 1.0."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nihanth" }]
keywords = [
    "code-optimization",
    "code-simplification",
    "static-analysis",
    "cyclomatic-complexity",
    "llm",
    "radon",
    "vulture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]

# Runtime dependencies, version-pinned. Kept in sync with the direct list in
# requirements.in (the source you edit for the direct runtime deps). The full
# closure lives in the generated, hash-locked requirements.txt (direct plus
# transitive, compiled with pip-compile --generate-hashes and installed with
# pip --require-hashes); requirements.txt is generated, never hand-edited. See
# decision 0028. This list mirrors requirements.in's pins, name-for-name.
dependencies = [
    "radon==6.0.1",
    "vulture==2.16",
    "pytest==9.0.3",
    "anthropic==0.111.0",
    "httpx==0.28.1",
]

[project.urls]
Repository = "https://github.com/nihanthnaidu007/Darwin"

# Console entry points (P8.3). Each maps a darwin-<name> command to the existing
# zero-arg main() of its module, so an installed wheel puts the six argparse-driven
# harnesses on PATH. The four non-argparse harnesses (bakeoff, smoke_test,
# build_case, validate_mcase) get NO console script by design; they
# stay `python -m darwin.<name>` dev tools.
[project.scripts]
darwin-loop = "darwin.loop:main"
darwin-mloop = "darwin.mloop:main"
darwin-benchmark = "darwin.benchmark:main"
darwin-mbenchmark = "darwin.mbenchmark:main"
darwin-variance = "darwin.variance_harness:main"
darwin-isolation-audit = "darwin.isolation_audit:main"

# Hatchling src-layout config: the importable package is darwin, living at src/darwin.
# Pointing the wheel target at that path makes hatchling ship the darwin package (and
# nothing above it) so docker/ build infra, including the seccomp example, stays OUT
# of the wheel. mdiffer.py and every other .py under the package ship automatically;
# the package carries no non-.py runtime data, so no package-data declaration is needed.
[tool.hatch.build.targets.wheel]
packages = ["src/darwin"]

# Quality tooling config (P0.2). Blocking as of P7.4: CI fails on any finding
# (.github/workflows/quality.yml). The gates ran advisory from P0.2 (decision 0016)
# until P7.3 drove all findings to zero, then P7.4 flipped them to blocking. ruff and
# mypy target the package source in src/darwin and the tests/ suite; cases/ (bloated
# benchmark fixtures) and spikes/ (experiments) are excluded so they generate no
# meaningless findings.

[tool.ruff]
# Default rule selection (E/F), no custom select. target-version matches
# requires-python (>=3.12).
target-version = "py312"
extend-exclude = ["cases", "spikes"]

[tool.mypy]
# Lenient baseline: tolerate unresolved third-party imports, no strict mode.
# The src/darwin and tests/ code is largely untyped; this records a baseline, it
# does not enforce.
ignore_missing_imports = true
exclude = ['^cases/', '^spikes/']

[tool.coverage.run]
# Package-scoped coverage: measure the darwin package only (the CI invocation passes
# --cov=darwin; source pins it here too so the floor always means production
# coverage). The tests live in tests/, OUTSIDE the package, so they fall out of the
# measurement naturally -- the test-file omit the flat tools/ layout needed is gone.
source = ["darwin"]

[tool.pytest.ini_options]
# The package lives under src/darwin and the tests under tests/, both imported via
# pythonpath rather than an install: putting src on sys.path makes `import darwin...`
# resolve, and pinning testpaths to tests/ keeps collection off the case/mcase suites
# under cases/ and mcases/ (named test_suite.py), which are data, not project tests.
pythonpath = ["src"]
testpaths = ["tests"]
