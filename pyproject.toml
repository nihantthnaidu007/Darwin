# Darwin — release metadata for the v2.0 (0.2.0) GitHub-tagged release.
#
# Version is 0.2.0, not 2.0.0, on purpose: 2.0.0 would signal a stable,
# production-grade release. v2.0 adds a real OS-level isolation boundary, but it
# still carries the in-process verdict-forgery residual (SECURITY.md), its
# isolation is verified on Docker Desktop and NOT yet on native Linux, and it is
# still single-function. 0.2.0 honestly signals "real isolation added, still early."
#
# Darwin is run FROM SOURCE: create a virtualenv and `pip install -r requirements.txt`,
# then build the sandbox image once (see README "Install"; Docker is now a
# prerequisite). This file declares coherent, honest release metadata — name,
# version, description, pinned runtime dependencies. It is a GitHub-tagged release;
# it is NOT published to PyPI.
#
# It intentionally omits a [build-system] table: Darwin is a set of flat scripts
# under tools/ that are run with `cwd = tools/`, NOT yet structured as an importable
# / pip-installable package. Adding a build backend now would advertise a
# `pip install .` path that does not actually work. A pip-installable distribution
# is deferred to a later release.

[project]
name = "darwin"
version = "0.2.0"
description = "A verified single-function Python code simplifier with a never-worse-than-baseline guarantee; v2.0 runs each candidate in a locked-down container (access-isolated, not a forgery-proof gate; native Linux not yet verified)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nihanth" }]
keywords = [
    "code-optimization",
    "code-simplification",
    "static-analysis",
    "cyclomatic-complexity",
    "llm",
    "radon",
    "vulture",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
]

# Runtime dependencies, version-pinned. Kept in sync with requirements.txt
# (the source of truth for `pip install -r`). Transitive deps are not lock-pinned.
dependencies = [
    "radon==6.0.1",
    "vulture==2.16",
    "pytest==8.3.5",
    "anthropic==0.107.1",
]

[project.urls]
Repository = "https://github.com/nihanthnaidu007/Darwin"
